<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Face Recognition Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { margin-bottom: 5px; }
    .status-panel {
      margin: 15px auto;
      padding: 10px 20px;
      width: max-content;
      border-radius: 8px;
      background: #1e1e1e;
      border: 1px solid #333;
    }
    .video-box {
      margin: 20px auto;
      max-width: 854px;
      border: 3px solid #333;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    img { width: 100%; height: auto; display: block; }
    .alarm-active {
      border-color: #ff0033 !important;
      animation: flash 1s infinite alternate;
    }
    @keyframes flash {
      from { box-shadow: 0 0 10px #ff0033; }
      to { box-shadow: 0 0 25px #ff0033; }
    }
    #log {
      max-width: 854px;
      margin: 10px auto;
      text-align: left;
      font-family: monospace;
      font-size: 13px;
      color: #888;
      background: #0a0a0a;
      padding: 10px;
      border-radius: 5px;
      height: 100px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h1>Security Monitoring Feed</h1>
  
  <div class="status-panel" id="statusPanel">
    Status: <span id="statusText" style="color: #ffcc00;">Connecting...</span> | 
    Approved Profiles: <span id="profilesCount">0</span>
  </div>

  <div class="video-box" id="videoContainer">
    <img id="streamFrame" src="" alt="Waiting for live stream connection...">
  </div>

  <div id="log">--- Intruder Event Log ---<br></div>

  <script>
    // =========================================================
    // PASTE YOUR CLOUDFLARE DOMAIN HERE (Do not include https:// or wss://)
    const CLOUDFLARE_DOMAIN = "particular-drug-operate-rapids.trycloudflare.com"; 
    // =========================================================

    const streamFrame = document.getElementById('streamFrame');
    const statusText = document.getElementById('statusText');
    const profilesCount = document.getElementById('profilesCount');
    const videoContainer = document.getElementById('videoContainer');
    const logDiv = document.getElementById('log');

    let ws;

    function logMessage(msg) {
      const time = new Date().toLocaleTimeString();
      logDiv.innerHTML += `[${time}] ${msg}<br>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function connectWebSocket() {
      // Constructs secure wss connection string for GitHub Pages HTTPS compatibility
      const wsUrl = `wss://${CLOUDFLARE_DOMAIN}/ws/stream`;
      logMessage(`Connecting to: ${wsUrl}`);
      
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusText.innerText = "LIVE STREAM ACTIVE";
        statusText.style.color = "#00ff66";
        logMessage("Connected to python video engine successfully.");
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        
        // Render base64 stream image frame
        streamFrame.src = "data:image/jpeg;base64," + data.image;
        profilesCount.innerText = data.profiles_count;

        // Alarm status toggle
        if (data.alarm) {
          videoContainer.classList.add('alarm-active');
          statusText.innerText = "⚠️ ALARM: UNKNOWN FACE DETECTED";
          statusText.style.color = "#ff0033";
        } else {
          videoContainer.classList.remove('alarm-active');
          statusText.innerText = "MONITORING ACTIVE";
          statusText.style.color = "#00ff66";
        }
      };

      ws.onclose = () => {
        statusText.innerText = "DISCONNECTED";
        statusText.style.color = "#ff0033";
        videoContainer.classList.remove('alarm-active');
        logMessage("Disconnected from server. Reconnecting in 3 seconds...");
        setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = (err) => {
        console.error("WebSocket Error:", err);
      };
    }

    // Initialize connection
    connectWebSocket();
  </script>
</body>
</html>
